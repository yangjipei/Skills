<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{MANUAL_TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.7;
    }
    .page {
      max-width: 1200px;
      margin: 32px auto;
      background: #fff;
      padding: 48px 56px 72px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    h1 { margin-top: 0; font-size: 32px; }
    h2 { margin-top: 42px; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb; }
    h3 { margin-top: 30px; }
    .meta, .path, .note, .result, .precondition {
      margin: 16px 0;
      padding: 14px 16px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }
    .step {
      margin: 18px 0;
      padding: 18px 20px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0 26px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f3f4f6; }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 16px auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>{{MANUAL_TITLE}}</h1>
    <div class="meta">{{DOCUMENT_META}}</div>
    {{MANUAL_CONTENT}}
  </main>
</body>
</html>
