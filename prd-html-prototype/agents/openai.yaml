interface:
  display_name: "04-页面 IA 与 HTML 原型"
  short_description: "在 PRD 前完成 Page IA、Spec、按需页面流程、HTML 与模块级 Delta 锁定"
  default_prompt: "使用 $prd-html-prototype 基于当前已确认需求分析和必要流程先建立 Page IA / Prototype Spec；需要页面流程时先交给 $business-flow-html 确认，再生成 HTML。后续修改只处理受影响 P/M Delta，并锁定已确认模块。"
policy:
  allow_implicit_invocation: true
